name: Export Smart Views (Lane 2 audit)

# One-off / on-demand audit — no cron. Read-only against Close (GET requests only).
# Exports all saved searches with their s_query filters so we can see what the
# existing views actually filter on before standardizing Lane 2 buckets.

on:
  workflow_dispatch:
    inputs:
      commit_index:
        description: "Commit smart_views_index.csv back to the repo (for diffing over time)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Export smart views
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
        run: python export_smart_views.py

      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: smart-views-export
          path: |
            smart_views_full.json
            smart_views_index.csv
          retention-days: 30
          if-no-files-found: error

      - name: Commit index
        if: ${{ inputs.commit_index }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart_views_index.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh smart view index ($(date -u +%Y-%m-%d))"
            git push
          fi
