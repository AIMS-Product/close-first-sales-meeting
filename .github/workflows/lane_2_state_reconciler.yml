name: Lane 2 State Reconciler

# Recomputes Recapture State / Owner Team / Entry Source / Objection Angle /
# Ever Had Call for every lead, and writes only what differs.
#
# Idempotent — backfill and steady-state are the same run. Safe to run repeatedly.
# Defaults to DRY RUN; you must tick `apply` to write.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write changes (unticked = dry run, writes nothing)"
        required: false
        default: false
        type: boolean
      limit:
        description: "Only process N leads (blank = all). Use for a first test."
        required: false
        default: ""
        type: string

  # Enable once the dry run looks right. Every 2h on weekdays, 7am-7pm PT.
  # schedule:
  #   - cron: "0 14-23/2 * * 1-5"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Reconcile
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          # scheduled runs always apply
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--apply"; fi
          echo "Running: lane2_state.py $ARGS"
          python lane2_state.py $ARGS | tee report.txt

      - name: Publish report
        if: always()
        run: |
          {
            echo "## Lane 2 State Reconciler"
            echo ""
            if [ "${{ inputs.apply }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
              echo "**Mode: APPLY** — changes written to Close."
            else
              echo "**Mode: DRY RUN** — nothing written."
            fi
            echo ""
            echo '```'
            cat report.txt 2>/dev/null || echo "(no report — see job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
