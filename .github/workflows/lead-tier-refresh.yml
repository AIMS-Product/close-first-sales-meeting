name: Refresh Close Lead Tier

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Update only Lead Tier; false previews changes
        type: boolean
        default: false
      export_id:
        description: Optional fresh export from the reviewed preview; same day and under 30 minutes old
        type: string
        default: ''
  schedule:
    - cron: '20 11 * * *'

permissions:
  contents: read

concurrency:
  group: close-lead-tier-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check classifier and field-only writes
        run: python -m unittest test_lead_tier_refresh -v
      - name: Refresh Lead Tier
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          EXPORT_ID: ${{ inputs.export_id }}
        run: |
          ARGS=()
          if [ -n "$EXPORT_ID" ]; then ARGS+=(--export-id "$EXPORT_ID"); fi
          if [ "$APPLY" = "true" ]; then
            python sync_lead_tier_tags.py --apply "${ARGS[@]}"
          else
            python sync_lead_tier_tags.py --dry-run "${ARGS[@]}"
          fi
      - name: Prepare aggregate run evidence
        if: always()
        run: python summarize_lead_tier_refresh.py
      - name: Retain aggregate run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-tier-refresh-${{ github.run_id }}
          path: outputs/lead_tier_sync_*.aggregate.json
          retention-days: 14
          if-no-files-found: ignore
