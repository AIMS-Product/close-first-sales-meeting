name: Repair Reviewed Zoom Outcomes

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the reviewed repairs to Close"
        required: true
        type: boolean
        default: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Test production matching
        run: |
          python outcome_sync.py --selftest
          python -m unittest -v test_outcome_sync.py

      - name: Recheck and repair reviewed outcomes
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          MIN_ATTEND_SECONDS: "300"
          HOST_MIN_SECONDS: "600"
          ZOOM_AUTO_NOSHOW: "1"
          APPLY_REPAIR: ${{ inputs.apply && '1' || '0' }}
        run: python repair_zoom_false_noshows.py

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-outcome-repair-report
          path: zoom_outcome_repair_report.json
          retention-days: 14
