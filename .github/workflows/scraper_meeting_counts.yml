name: Scraper Meeting Counts Report

on:
  workflow_dispatch:
    inputs:
      date_start:
        description: 'Start date (YYYY-MM-DD, Pacific, inclusive)'
        required: true
        type: string
      date_end:
        description: 'End date (YYYY-MM-DD, Pacific, inclusive)'
        required: true
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run report
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          DATE_START: ${{ inputs.date_start }}
          DATE_END: ${{ inputs.date_end }}
          PYTHONUNBUFFERED: "1"
        run: python3 -u scraper_meeting_counts.py
