name: Sync Opportunity -> Lead Status

on:
  schedule:
    - cron: "*/30 * * * *"   # fallback -- primary trigger is cron-job.org (see setup doc)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, zero writes)"
        type: boolean
        default: false
      limit:
        description: "Only scan first N leads (quick test, optional -- try 20 first)"
        type: string
        default: ""
      lookback_days:
        description: "Only evaluate opportunities updated in the last N days (optional, leave blank for full scan)"
        type: string
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.lookback_days }}" ]; then
            ARGS="$ARGS --lookback-days ${{ inputs.lookback_days }}"
          fi
          python sync_opp_lead_status.py $ARGS
