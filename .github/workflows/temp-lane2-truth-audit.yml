# Temporary read-only Zoom conflict shadow audit.
# Runs manually with repo secrets and does not write to Close.

name: Zoom Conflict Shadow Audit

on:
  workflow_dispatch:
    # Retained so this branch can be dispatched through the workflow definition
    # that already exists on main. The shadow itself always scans seven days.
    inputs:
      date:
        description: "Pacific date to audit, YYYY-MM-DD"
        required: true
        default: "2026-08-17"
      no_zoom:
        description: "Skip Zoom participant reports"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Test shadow classifier
        run: |
          python outcome_sync.py --selftest
          python -m unittest -v test_outcome_sync.py test_shadow_zoom_conflicts.py

      - name: Run read-only shadow audit
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          LOOKBACK_DAYS: "7"
          AUDIT_MONTH_TO_DATE: "1"
        run: python shadow_zoom_conflicts.py

      - name: Upload shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-conflict-shadow-report
          path: zoom_conflict_shadow_report.json
          retention-days: 14
