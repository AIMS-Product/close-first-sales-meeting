name: Lane 2 — 30-Day Release (clear Lead Owner)

# Clears Lead Owner on leads in Smart View "L2 Handoff: 30 Days since Booking"
# (skipping Recapture State Booked / Suppressed). It assigns nothing: the
# scraper assigner deals released leads from the unowned pool.
#
# Native GitHub schedule — cron-job.org is no longer used for this job.
# Once a weekday, and ORDER MATTERS more than precision:
#   12:00 UTC  this release     (05:00 PDT / 04:00 PST)
#   13:00 UTC  assign_lane2_leads.yml  (06:00 PDT / 05:00 PST)
# The hour gap absorbs GitHub's scheduling delay, so leads released here are
# dealt the same morning. If the assigner's cron moves, move this one with it.
#
# A scheduled run sends no inputs, so dry_run is empty and the run is LIVE.
# Keep it that way — a positive "apply" flag would make the schedule a no-op.

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report who would be released, write nothing'
        type: boolean
        default: false

permissions:
  contents: read   # release mode writes nothing back to the repo

concurrency:
  group: lane2-30day-release
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Release 30-day aged leads
        run: python update_lane2_reassignment.py
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
